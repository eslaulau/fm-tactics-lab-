name: Windows platform boundary

on:
  push:
    branches:
      - work/runtime-dependency-layout-20261114
      - work/inprocess-native-bridge-20261115
  pull_request:
    paths:
      - "native/platform_dependency_stub.cpp"
      - "native/desktop_host.cpp"
      - "native/inprocess_bridge_exports.cpp"
      - "integration/BepInEx/FMTL.NativeBridge/**"
      - "src/inprocess_bridge.py"
      - "src/desktop_warm_batch.py src/fm27_tactics_server.py"
      - "native/platform_stub_iat_verifier.h"
      - "native/platform_probe_stub_template.cpp"
      - "native/native_steam_lifecycle.h"
      - "native/platform_stub_loader_smoke.cpp"
      - "native/platform_stub_import_fixture.cpp"
      - "native/profile_metadata.json"
      - "native/adapter_registry.json"
      - "scripts/generate_profile.py"
      - "scripts/profile_header.py"
      - "scripts/build_exe.py"
      - "scripts/export_source.py"
      - "src/runtime_layout.py"
      - "src/desktop_engine.py"
      - "scripts/build_platform_probe_stubs.py"
      - "scripts/build_native.py"
      - "scripts/verify_platform_probe_stubs.py"
      - "tests/test_adapter_registry.py"
      - "tests/test_release.py"
      - "docs/DEVELOPMENT.md"
      - "CHANGELOG.md"
      - "Launcher.cs"
      - "scripts/run.py"
      - "tests/test_inprocess_bridge_source.py"
      - "tests/test_inprocess_bridge.py"
      - "tests/test_inprocess_mode_ui.py"
      - "tests/test_platform_stub_boundary.py"
      - "tests/test_runtime_layout.py"
      - ".github/workflows/windows-platform-boundary.yml"
  workflow_dispatch:

concurrency:
  group: windows-platform-boundary-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile-fail-closed-platform-stubs:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up .NET SDK for the BepInEx bridge
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Enter x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Check changed Python build and verification scripts
        shell: pwsh
        run: |
          python -m py_compile scripts/generate_profile.py scripts/profile_header.py scripts/build_native.py scripts/build_exe.py scripts/export_source.py scripts/build_platform_probe_stubs.py scripts/verify_platform_stub_exports.py scripts/verify_platform_probe_stubs.py scripts/run.py src/runtime_layout.py src/desktop_engine.py src/inprocess_bridge.py src/desktop_warm_batch.py src/fm27_tactics_server.py
          if ($LASTEXITCODE -ne 0) { throw "Python compile check failed" }

      - name: Run runtime-layout regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_runtime_layout.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Runtime-layout tests failed" }

      - name: Run platform-boundary source tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_platform_stub_boundary.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Platform-boundary tests failed" }

      - name: Run native adapter registry regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_adapter_registry.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Native adapter registry tests failed" }

      - name: Run public source release tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_release.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Public source release tests failed" }

      - name: Compile native host with a temporary compile-only profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nativeBuild = Join-Path $PWD "build\native-host-compile-only"
          New-Item -ItemType Directory -Force -Path $nativeBuild | Out-Null
          Get-ChildItem "native" -File | Where-Object { $_.Extension -in @(".h", ".cpp", ".manifest") } | Copy-Item -Destination $nativeBuild

          @'
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from profile_header import header

          metadata = json.loads((root / "native/profile_metadata.json").read_text(encoding="utf-8"))
          for item in metadata["ranges"]:
              item["hex"] = "00" * int(item["size"])
          output = root / "build/native-host-compile-only/engine_compat_profile.h"
          output.write_text(header(metadata), encoding="ascii")
          print("Generated a temporary compile-only header; it is not valid for runtime compatibility checks.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Compile-only profile generation failed" }

          Push-Location $nativeBuild
          try {
            & cl.exe /nologo /O2 /EHsc /std:c++17 desktop_host.cpp /Fe:FM27Simulator_compile_only.exe /Fo:desktop_host.obj /link /INCREMENTAL:NO /MANIFEST:EMBED /MANIFESTINPUT:host.manifest user32.lib
            if ($LASTEXITCODE -ne 0) { throw "Native host C++ compile/link failed" }
          }
          finally {
            Pop-Location
          }

      - name: Compile and verify the in-process native bridge DLL
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nativeBuild = Join-Path $PWD "build\\native-host-compile-only"
          Push-Location $nativeBuild
          try {
            & cl.exe /nologo /LD /O2 /EHsc /std:c++17 inprocess_bridge_exports.cpp /Fe:FM27InProcessNative_compile_only.dll /Fo:inprocess_bridge_exports.obj /link /INCREMENTAL:NO user32.lib bcrypt.lib
            if ($LASTEXITCODE -ne 0) { throw "In-process native bridge DLL compile/link failed" }
            $exports = & dumpbin.exe /nologo /exports FM27InProcessNative_compile_only.dll
            if ($LASTEXITCODE -ne 0) { throw "dumpbin failed for in-process native bridge" }
            $joined = $exports -join "`n"
            foreach ($name in @("FM27InProcessAbiVersion", "FM27InProcessCheckReady", "FM27InProcessRunManifest", "FM27InProcessCancel")) {
              if ($joined -notmatch [regex]::Escape($name)) { throw "Missing in-process bridge export: $name" }
            }
          }
          finally {
            Pop-Location
          }

      - name: Prepare BepInEx IL2CPP references
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $PWD "build\\BepInEx-IL2CPP.zip"
          $referenceRoot = Join-Path $PWD "build\\bepinex-reference-game"
          New-Item -ItemType Directory -Force -Path (Split-Path $archive) | Out-Null
          Invoke-WebRequest -Uri "https://builds.bepinex.dev/projects/bepinex_be/791/BepInEx-Unity.IL2CPP-win-x64-6.0.0-be.791%2Bb782da4.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $referenceRoot -Force
          if (!(Test-Path (Join-Path $referenceRoot "BepInEx\\core\\BepInEx.Unity.IL2CPP.dll"))) { throw "BepInEx IL2CPP references not found in downloaded archive" }

      - name: Build the BepInEx native bridge plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $referenceRoot = Join-Path $PWD "build\\bepinex-reference-game"
          dotnet build integration/BepInEx/FMTL.NativeBridge/FMTL.NativeBridge.csproj --configuration Release -p:FM27Dir=$referenceRoot -p:SkipDeploy=true
          if ($LASTEXITCODE -ne 0) { throw "BepInEx Native Bridge plugin build failed" }

      - name: Compile the desktop launcher with adapter argument forwarding
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $PWD "build\\launcher-compile-only"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $csc = Join-Path $env:WINDIR "Microsoft.NET\\Framework64\\v4.0.30319\\csc.exe"
          & $csc /nologo /target:winexe /platform:x64 /optimize+ /utf8output /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.IO.Compression.dll /reference:System.IO.Compression.FileSystem.dll ("/out:" + (Join-Path $build "FM27TacticsLauncher_compile_only.exe")) Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "Desktop launcher C# compile failed" }

      - name: Run in-process bridge source-contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_inprocess_bridge_source.py" -v
          if ($LASTEXITCODE -ne 0) { throw "In-process bridge source tests failed" }

      - name: Run in-process Python bridge client tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_inprocess_bridge.py" -v
          if ($LASTEXITCODE -ne 0) { throw "In-process Python bridge client tests failed" }

      - name: Run desktop execution mode UI contract tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_inprocess_mode_ui.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Desktop execution mode UI tests failed" }

      - name: Compile both x64 fail-closed import stubs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $PWD "build\platform-stubs"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $source = Join-Path $PWD "native\platform_dependency_stub.cpp"
          $variants = @(
            @{ Name = "PartyWin"; Define = "BUILD_PARTYWIN_STUB"; Expected = 20 },
            @{ Name = "PlayFabMultiplayerWin"; Define = "BUILD_PLAYFAB_STUB"; Expected = 19 }
          )

          foreach ($variant in $variants) {
            $object = Join-Path $build ($variant.Name + ".obj")
            $dll = Join-Path $build ($variant.Name + ".dll")
            $importLibrary = Join-Path $build ($variant.Name + ".lib")
            & cl.exe /nologo /LD /O2 /GS- /Zl ("/D" + $variant.Define + "=1") $source ("/Fo" + $object) /link /NODEFAULTLIB /ENTRY:DllMain /SUBSYSTEM:WINDOWS kernel32.lib /INCREMENTAL:NO ("/IMPLIB:" + $importLibrary) ("/OUT:" + $dll)
            if ($LASTEXITCODE -ne 0) { throw ("MSVC build failed: " + $variant.Name) }

            $exports = & dumpbin.exe /nologo /exports $dll
            if ($LASTEXITCODE -ne 0) { throw ("dumpbin failed: " + $variant.Name) }
            $names = @(
              $exports | ForEach-Object {
                if ($_ -match '^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+([A-Za-z_][A-Za-z0-9_]*)') {
                  $Matches[1]
                }
              }
            )
            if ($names.Count -ne $variant.Expected) {
              throw ("Unexpected export count for " + $variant.Name + ": " + $names.Count + " / " + $variant.Expected)
            }
            Write-Host ($variant.Name + ".dll exports verified: " + $names.Count)
          }

      - name: Compile and verify API-identifying Steam EOS diagnostic probes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/build_platform_probe_stubs.py --output build/platform-probes
          if ($LASTEXITCODE -ne 0) { throw "Steam/EOS diagnostic probe build or PE verification failed" }

      - name: Smoke-test Windows binding to preloaded stub DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $PWD "build\platform-stubs"
          $fixtureSource = Join-Path $PWD "native\platform_stub_import_fixture.cpp"
          $fixtureObject = Join-Path $build "platform_stub_import_fixture.obj"
          $fixtureDll = Join-Path $build "platform_stub_import_fixture.dll"
          & cl.exe /nologo /LD /O2 /GS- /Zl $fixtureSource ("/Fo" + $fixtureObject) /link /NODEFAULTLIB /ENTRY:DllMain /SUBSYSTEM:WINDOWS (Join-Path $build "PartyWin.lib") (Join-Path $build "PlayFabMultiplayerWin.lib") /INCREMENTAL:NO ("/OUT:" + $fixtureDll)
          if ($LASTEXITCODE -ne 0) { throw "Could not build the synthetic importer fixture" }

          $smokeSource = Join-Path $PWD "native\platform_stub_loader_smoke.cpp"
          $smokeObject = Join-Path $build "platform_stub_loader_smoke.obj"
          $smokeExe = Join-Path $build "platform_stub_loader_smoke.exe"
          & cl.exe /nologo /O2 /EHsc /std:c++17 $smokeSource ("/Fo" + $smokeObject) ("/Fe:" + $smokeExe)
          if ($LASTEXITCODE -ne 0) { throw "Could not build the Windows loader smoke test" }

          & $smokeExe (Join-Path $build "PartyWin.dll") (Join-Path $build "PlayFabMultiplayerWin.dll") $fixtureDll
          if ($LASTEXITCODE -ne 0) { throw "Windows did not bind all synthetic imports to the preloaded stub modules" }


      - name: Upload exact native host source files
        uses: actions/upload-artifact@v4
        with:
          name: fm27-activation-scan-source
          path: |
            native/desktop_host.cpp
            native/inprocess_bridge_exports.cpp
            native/native_steam_lifecycle.h
            integration/BepInEx/FMTL.NativeBridge/FMTL.NativeBridge.csproj
            integration/BepInEx/FMTL.NativeBridge/NativeBridgePlugin.cs
            src/runtime_layout.py
            src/desktop_engine.py
            scripts/run.py
            tests/test_runtime_layout.py
            tests/test_platform_stub_boundary.py
            tests/test_inprocess_bridge_source.py
            .github/workflows/windows-platform-boundary.yml
          if-no-files-found: error
          retention-days: 7

      - name: Upload registered adapter source bundle
        uses: actions/upload-artifact@v4
        with:
          name: fm27-adapter-registry-source
          path: |
            native/desktop_host.cpp
            native/inprocess_bridge_exports.cpp
            native/adapter_registry.json
            integration/BepInEx/FMTL.NativeBridge/FMTL.NativeBridge.csproj
            integration/BepInEx/FMTL.NativeBridge/NativeBridgePlugin.cs
            native/profile_metadata.json
            native/adapter_version.json
            scripts/generate_profile.py
            scripts/profile_header.py
            scripts/build_native.py
            scripts/build_exe.py
            scripts/export_source.py
            scripts/run.py
            src/desktop_engine.py
            src/runtime_layout.py
            Launcher.cs
            tests/test_adapter_registry.py
            tests/test_release.py
            tests/test_platform_stub_boundary.py
            tests/test_inprocess_bridge_source.py
            docs/DEVELOPMENT.md
            CHANGELOG.md
            .github/workflows/windows-platform-boundary.yml
          if-no-files-found: error
          retention-days: 7

      - name: Verify PE exports against the pinned engine import manifest
        shell: pwsh
        run: |
          python scripts/verify_platform_stub_exports.py build/platform-stubs/PartyWin.dll build/platform-stubs/PlayFabMultiplayerWin.dll
          if ($LASTEXITCODE -ne 0) { throw "Compiled platform stub PE verification failed" }

      - name: Export complete local-engine source package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/export_source.py --output build/FM27_Local_Engine_Source.zip
          if ($LASTEXITCODE -ne 0) { throw "Local-engine source export failed" }

      - name: Upload complete local-engine source package
        uses: actions/upload-artifact@v4
        with:
          name: fm27-local-engine-source
          path: build/FM27_Local_Engine_Source.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiled in-process bridge preview
        uses: actions/upload-artifact@v4
        with:
          name: fm27-inprocess-native-bridge-preview
          path: |
            build/native-host-compile-only/FM27InProcessNative_compile_only.dll
            integration/BepInEx/FMTL.NativeBridge/bin/Release/net6.0/FMTL.NativeBridge.dll
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiled stub binaries for inspection
        uses: actions/upload-artifact@v4
        with:
          name: fm27-fail-closed-platform-stubs-x64
          path: |
            build/platform-stubs/*.dll
            build/platform-probes/*.dll
          if-no-files-found: error
