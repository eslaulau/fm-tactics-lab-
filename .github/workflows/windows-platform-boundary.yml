name: Windows platform boundary

on:
  push:
    branches:
      - work/runtime-dependency-layout-20261114
  pull_request:
    paths:
      - "native/platform_dependency_stub.cpp"
      - "native/desktop_host.cpp"
      - "native/profile_metadata.json"
      - "src/runtime_layout.py"
      - "tests/test_platform_stub_boundary.py"
      - "tests/test_runtime_layout.py"
      - ".github/workflows/windows-platform-boundary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-fail-closed-platform-stubs:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Enter x64 MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Run runtime-layout regression tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_runtime_layout.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Runtime-layout tests failed" }

      - name: Run platform-boundary source tests
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_platform_stub_boundary.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Platform-boundary tests failed" }

      - name: Compile native host with a temporary compile-only profile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $nativeBuild = Join-Path $PWD "build\native-host-compile-only"
          New-Item -ItemType Directory -Force -Path $nativeBuild | Out-Null
          Get-ChildItem "native" -File | Where-Object { $_.Extension -in @(".h", ".cpp", ".manifest") } | Copy-Item -Destination $nativeBuild

          @'
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / "scripts"))
          from profile_header import header

          metadata = json.loads((root / "native/profile_metadata.json").read_text(encoding="utf-8"))
          for item in metadata["ranges"]:
              item["hex"] = "00" * int(item["size"])
          output = root / "build/native-host-compile-only/engine_compat_profile.h"
          output.write_text(header(metadata), encoding="ascii")
          print("Generated a temporary compile-only header; it is not valid for runtime compatibility checks.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Compile-only profile generation failed" }

          Push-Location $nativeBuild
          try {
            & cl.exe /nologo /O2 /EHsc /std:c++17 desktop_host.cpp /Fe:FM27Simulator_compile_only.exe /Fo:desktop_host.obj /link /INCREMENTAL:NO /MANIFEST:EMBED /MANIFESTINPUT:host.manifest user32.lib
            if ($LASTEXITCODE -ne 0) { throw "Native host C++ compile/link failed" }
          }
          finally {
            Pop-Location
          }

      - name: Compile both x64 fail-closed import stubs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $PWD "build\platform-stubs"
          New-Item -ItemType Directory -Force -Path $build | Out-Null
          $source = Join-Path $PWD "native\platform_dependency_stub.cpp"
          $variants = @(
            @{ Name = "PartyWin"; Define = "BUILD_PARTYWIN_STUB"; Expected = 20 },
            @{ Name = "PlayFabMultiplayerWin"; Define = "BUILD_PLAYFAB_STUB"; Expected = 19 }
          )

          foreach ($variant in $variants) {
            $object = Join-Path $build ($variant.Name + ".obj")
            $dll = Join-Path $build ($variant.Name + ".dll")
            $importLibrary = Join-Path $build ($variant.Name + ".lib")
            & cl.exe /nologo /LD /O2 /GS- /Zl ("/D" + $variant.Define + "=1") $source ("/Fo" + $object) /link /NODEFAULTLIB /ENTRY:DllMain /SUBSYSTEM:WINDOWS kernel32.lib /INCREMENTAL:NO ("/IMPLIB:" + $importLibrary) ("/OUT:" + $dll)
            if ($LASTEXITCODE -ne 0) { throw ("MSVC build failed: " + $variant.Name) }

            $exports = & dumpbin.exe /nologo /exports $dll
            if ($LASTEXITCODE -ne 0) { throw ("dumpbin failed: " + $variant.Name) }
            $names = @(
              $exports | ForEach-Object {
                if ($_ -match '^\s*\d+\s+[0-9A-Fa-f]+\s+[0-9A-Fa-f]+\s+([A-Za-z_][A-Za-z0-9_]*)') {
                  $Matches[1]
                }
              }
            )
            if ($names.Count -ne $variant.Expected) {
              throw ("Unexpected export count for " + $variant.Name + ": " + $names.Count + " / " + $variant.Expected)
            }
            Write-Host ($variant.Name + ".dll exports verified: " + $names.Count)
          }

      - name: Smoke-test Windows binding to preloaded stub DLLs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $build = Join-Path $PWD "build\platform-stubs"
          $fixtureSource = Join-Path $PWD "native\platform_stub_import_fixture.cpp"
          $fixtureObject = Join-Path $build "platform_stub_import_fixture.obj"
          $fixtureDll = Join-Path $build "platform_stub_import_fixture.dll"
          & cl.exe /nologo /LD /O2 /GS- /Zl $fixtureSource ("/Fo" + $fixtureObject) /link /NODEFAULTLIB /ENTRY:DllMain /SUBSYSTEM:WINDOWS (Join-Path $build "PartyWin.lib") (Join-Path $build "PlayFabMultiplayerWin.lib") /INCREMENTAL:NO ("/OUT:" + $fixtureDll)
          if ($LASTEXITCODE -ne 0) { throw "Could not build the synthetic importer fixture" }

          $smokeSource = Join-Path $PWD "native\platform_stub_loader_smoke.cpp"
          $smokeObject = Join-Path $build "platform_stub_loader_smoke.obj"
          $smokeExe = Join-Path $build "platform_stub_loader_smoke.exe"
          & cl.exe /nologo /O2 /EHsc /std:c++17 $smokeSource ("/Fo" + $smokeObject) ("/Fe:" + $smokeExe)
          if ($LASTEXITCODE -ne 0) { throw "Could not build the Windows loader smoke test" }

          & $smokeExe (Join-Path $build "PartyWin.dll") (Join-Path $build "PlayFabMultiplayerWin.dll") $fixtureDll
          if ($LASTEXITCODE -ne 0) { throw "Windows did not bind all synthetic imports to the preloaded stub modules" }

      - name: Verify PE exports against the pinned engine import manifest
        shell: pwsh
        run: |
          python scripts/verify_platform_stub_exports.py build/platform-stubs/PartyWin.dll build/platform-stubs/PlayFabMultiplayerWin.dll
          if ($LASTEXITCODE -ne 0) { throw "Compiled platform stub PE verification failed" }

      - name: Upload compiled stub binaries for inspection
        uses: actions/upload-artifact@v4
        with:
          name: fm27-fail-closed-platform-stubs-x64
          path: build/platform-stubs/*.dll
          if-no-files-found: error
