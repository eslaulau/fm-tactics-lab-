name: Build patched v1112 Windows EXE

on:
  push:
    branches:
      - fix/steam-client-bootstrap
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out patched source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure x64 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download the exact v1112 inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force inputs | Out-Null
          gh release download tactics --repo $env:GITHUB_REPOSITORY --pattern "FM27-Tactics-Lab-v1112.exe" --pattern "game_plugin.dll" --dir inputs
          $expected = @{
            "inputs/FM27-Tactics-Lab-v1112.exe" = "60c1b60b84cabc6362e3f3ebab1b7a4aa9dc27d57bd445af1c026c5ed22b7355"
            "inputs/game_plugin.dll" = "f79b0a3413dd0e3f461b0afbc3ff397003f4a26d7525a30717428de6a8b91196"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) {
              throw "SHA-256 mismatch for $($entry.Key): $actual"
            }
            Write-Host "Verified $($entry.Key)"
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check dnfile==0.16.4

      - name: Extract v1112 private runtime inputs
        shell: pwsh
        run: |
          python scripts/prepare_private.py --release-exe "inputs/FM27-Tactics-Lab-v1112.exe"

      - name: Generate matching adapter and compile native host
        shell: pwsh
        run: |
          python scripts/build_native.py --reference-dll "inputs/game_plugin.dll"

      - name: Run project tests
        shell: pwsh
        run: |
          python -m compileall -q src scripts
          python -m unittest discover -s tests -v

      - name: Package patched desktop EXE
        shell: pwsh
        run: |
          $pythonHome = (& python -c "import sys; print(sys.prefix)").Trim()
          python scripts/build_exe.py --python-home "$pythonHome"
          $sourceExe = "dist/FM27-Tactics-Lab-v1112.exe"
          $targetExe = "dist/FM27-Tactics-Lab-v1112-NoSteamBootstrap.exe"
          Move-Item -LiteralPath $sourceExe -Destination $targetExe -Force
          $manifestPath = "dist/private-build.json"
          $manifest = Get-Content -LiteralPath $manifestPath -Raw | ConvertFrom-Json
          $manifest.file = [System.IO.Path]::GetFileName($targetExe)
          $manifest.sha256 = (Get-FileHash -LiteralPath $targetExe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Write-Host "Built $targetExe"
          Get-FileHash -LiteralPath $targetExe -Algorithm SHA256

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: FM27-Tactics-Lab-v1112-NoSteamBootstrap-Windows-x64
          path: |
            dist/FM27-Tactics-Lab-v1112-NoSteamBootstrap.exe
            dist/private-build.json
          if-no-files-found: error
          retention-days: 30
