name: Build FM27 Local Tactics Lab 1.0.0

on:
  push:
    branches:
      - release/fm27-local-tactics-lab-1.0.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Configure x64 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Download pinned FM27 runtime inputs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force inputs | Out-Null
          gh release download tactics --repo $env:GITHUB_REPOSITORY --pattern "FM27-Tactics-Lab-v1112.exe" --pattern "game_plugin.dll" --dir inputs
          $expected = @{
            "inputs/FM27-Tactics-Lab-v1112.exe" = "60c1b60b84cabc6362e3f3ebab1b7a4aa9dc27d57bd445af1c026c5ed22b7355"
            "inputs/game_plugin.dll" = "f79b0a3413dd0e3f461b0afbc3ff397003f4a26d7525a30717428de6a8b91196"
          }
          foreach ($entry in $expected.GetEnumerator()) {
            $actual = (Get-FileHash -LiteralPath $entry.Key -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $entry.Value) { throw "SHA-256 mismatch for $($entry.Key): $actual" }
            Write-Host "Verified $($entry.Key)"
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check dnfile==0.16.4

      - name: Extract pinned editor and match-fixture assets
        shell: pwsh
        run: python scripts/prepare_private.py --release-exe "inputs/FM27-Tactics-Lab-v1112.exe"

      - name: Build native host against the original FM27 DLL
        shell: pwsh
        run: python scripts/build_native.py --reference-dll "inputs/game_plugin.dll"

      - name: Run Python compilation and unit tests
        shell: pwsh
        run: |
          python -m compileall -q src scripts
          python -m unittest discover -s tests -v

      - name: Package standalone desktop executable
        shell: pwsh
        run: |
          $pythonHome = (& python -c "import sys; print(sys.prefix)").Trim()
          python scripts/build_exe.py --python-home "$pythonHome"
          $exe = "dist/FM27-Local-Tactics-Lab-1.0.0.exe"
          if (-not (Test-Path $exe)) { throw "Expected executable was not produced: $exe" }
          Get-FileHash -LiteralPath $exe -Algorithm SHA256
          Get-Content -LiteralPath "dist/private-build.json"

      - name: Smoke-test packaged desktop executable
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/FM27-Local-Tactics-Lab-1.0.0.exe").Path
          $testData = Join-Path $PWD "build/self-test-data"
          $process = Start-Process -FilePath $exe -ArgumentList @("--self-test", "--data-dir", $testData) -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) {
            $errorLog = Join-Path $testData "startup-error.txt"
            if (Test-Path $errorLog) { Get-Content -LiteralPath $errorLog }
            throw "Packaged EXE startup self-test failed: $($process.ExitCode)"
          }
          $resultPath = Join-Path $testData "self-test.json"
          if (-not (Test-Path $resultPath)) { throw "Missing self-test result." }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if (-not $result.ok -or $result.native_match_executed) { throw "Unexpected self-test result: $($result | ConvertTo-Json -Compress)" }
          Write-Host "Desktop EXE packaging and backend endpoint smoke test passed. Native full-match testing remains a separate local-game acceptance test."

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v4
        with:
          name: FM27-Local-Tactics-Lab-1.0.0-Windows-x64
          path: |
            dist/FM27-Local-Tactics-Lab-1.0.0.exe
            dist/private-build.json
          if-no-files-found: error
          retention-days: 30
